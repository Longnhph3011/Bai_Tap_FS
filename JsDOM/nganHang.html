<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

.container {
width: 100%;
height: 800px;
    display: flex;
    justify-content: space-between;
    padding: 10px;
}

.bank .item {
    display: flex;
    flex-direction: column;
    width: 25%; 
    height: 500px;
    background-color: #f8f8f8;
    border-radius: 8px;
    box-sizing: border-box;
}

.bank-name {
    height: 50px;
    width: 100%;
    background-color: #333;
    color: white;
    text-align: center;
    line-height: 50px;
    font-size: 18px;
    word-wrap: break-word;
    padding: 0 10px;
}
.item .bank-logo {
    flex: 1;
    display: flex;
    justify-content: center; 
    align-items: center;
}

.bank-logo img {
    max-width: 100%;
    max-height: 100px;
    object-fit: contain;
    object-position: center;
}



</style>
</head>
<body>
    <h1>Danh sách ngân hàng</h1>
    <div class="container">
        <div id="bank">

        </div>
    </div>
</body>
<script>
    let api=
    {
    "data": [
        {
            "id": 17,
            "name": "Ngân hàng TMCP Công thương Việt Nam",
            "code": "ICB",
            "bin": "970415",
            "shortName": "VietinBank",
            "logo": "https://api.vietqr.io/img/ICB.png",
            "transferSupported": 1,
            "lookupSupported": 1,
            "short_name": "VietinBank",
            "support": 3,
            "isTransfer": 1,
            "swift_code": "ICBVVNVX"
        },
        {
            "id": 43,
            "name": "Ngân hàng TMCP Ngoại Thương Việt Nam",
            "code": "VCB",
            "bin": "970436",

        },

            "logo": "https://api.vietqr.io/img/BIDV.png",
            "transferSupported": 1,

            "short_name": "BIDV",

        },
        {

        }
    ]
    }
    const bankListContainer = document.getElementById("bank");
api.data.forEach(bank => {
    const bankItem = document.createElement("div");
    bankItem.classList.add("item");

    bankItem.innerHTML = `
        <div class="bank-name">${bank.name}</div>
        <div class="bank-logo"><img src="${bank.logo}" alt="Logo"></div>
    `;

    bankListContainer.appendChild(bankItem);
});

</script>
</html>
